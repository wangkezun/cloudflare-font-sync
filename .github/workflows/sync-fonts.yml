name: Sync font releases

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and upload even when the version is unchanged
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-font-releases
  cancel-in-progress: false

env:
  R2_BUCKET: sarasa-fonts
  R2_PREFIX: static/fonts
  PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://wkz.io' }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Node dependencies
        run: npm ci

      - name: Ensure R2 bucket exists
        run: |
          if npx wrangler r2 bucket info "$R2_BUCKET" --json >/dev/null 2>&1; then
            echo "R2 bucket '$R2_BUCKET' already exists."
          else
            echo "Creating R2 bucket '$R2_BUCKET'..."
            npx wrangler r2 bucket create "$R2_BUCKET"
          fi

      - name: Resolve latest stable release
        env:
          SARASA_GITHUB_TOKEN: ${{ github.token }}
        run: npm run resolve

      - name: Fetch deployed manifest
        run: |
          if ! curl --fail --silent --show-error --max-time 20 \
            --output build/remote-manifest.json \
            "${PUBLIC_BASE_URL%/}/static/fonts/manifest.json"; then
            printf '{}\n' > build/remote-manifest.json
          fi
          jq -e 'type == "object"' build/remote-manifest.json >/dev/null

      - name: Decide which sources need an update
        id: version
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          node scripts/plan-sync.mjs >> "$GITHUB_OUTPUT"

      - name: Install font conversion dependencies
        if: steps.version.outputs.any_update == 'true'
        run: python -m pip install 'fonttools[woff]==4.63.0'

      - name: Install 7-Zip
        if: steps.version.outputs.sarasa_update == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes p7zip-full

      - name: Download Sarasa release assets
        if: steps.version.outputs.sarasa_update == 'true'
        run: |
          mkdir -p build/archives build/ttf
          jq -r '.sources.sarasa.assets[] | [.url, .name] | @tsv' build/release.json | \
            while IFS=$'\t' read -r url name; do
              curl --fail --location --retry 5 --retry-all-errors \
                --output "build/archives/$name" "$url"
              7z x -y "build/archives/$name" -obuild/ttf
            done

      - name: Convert Sarasa TTF files to WOFF2
        if: steps.version.outputs.sarasa_update == 'true'
        run: python scripts/convert_fonts.py

      - name: Download and convert Symbols Nerd Font Mono
        if: steps.version.outputs.nerd_update == 'true'
        run: |
          mkdir -p build/archives build/nerd-fonts
          url="$(jq -r .sources.nerdFonts.asset.url build/release.json)"
          name="$(jq -r .sources.nerdFonts.asset.name build/release.json)"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "build/archives/$name" "$url"
          tar -xJf "build/archives/$name" -C build/nerd-fonts
          python scripts/convert_nerd_font.py

      - name: Upload updated versioned fonts to R2
        if: steps.version.outputs.any_update == 'true'
        run: |
          for partial in build/woff2/*/manifest.json; do
            directory="$(dirname "$partial")"
            jq -r '.files[] | [.name, .key] | @tsv' "$partial" | \
              while IFS=$'\t' read -r name key; do
                npx wrangler r2 object put \
                  "$R2_BUCKET/$R2_PREFIX/$key" \
                  --file="$directory/$name" \
                  --content-type="font/woff2" \
                  --cache-control="public, max-age=3600, s-maxage=31536000, stale-while-revalidate=86400" \
                  --remote
              done
          done

      - name: Merge source manifests
        if: steps.version.outputs.any_update == 'true'
        run: |
          partials=()
          [[ -f build/woff2/sarasa/manifest.json ]] && partials+=(build/woff2/sarasa/manifest.json)
          [[ -f build/woff2/nerd-fonts/manifest.json ]] && partials+=(build/woff2/nerd-fonts/manifest.json)
          node scripts/merge-manifest.mjs \
            build/remote-manifest.json build/woff2/manifest.json "${partials[@]}"

      - name: Activate release atomically
        if: steps.version.outputs.any_update == 'true'
        run: |
          npx wrangler r2 object put \
            "$R2_BUCKET/$R2_PREFIX/manifest.json" \
            --file=build/woff2/manifest.json \
            --content-type="application/json; charset=utf-8" \
            --cache-control="no-cache" \
            --remote

      - name: Write job summary
        run: |
          if [[ "${{ steps.version.outputs.any_update }}" == "true" ]]; then
            echo "Activated font manifest:" >> "$GITHUB_STEP_SUMMARY"
            echo "- Sarasa: ${{ steps.version.outputs.latest_sarasa }} (updated: ${{ steps.version.outputs.sarasa_update }})" >> "$GITHUB_STEP_SUMMARY"
            echo "- Nerd Fonts: ${{ steps.version.outputs.latest_nerd }} (updated: ${{ steps.version.outputs.nerd_update }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Both font sources are already current; nothing uploaded." >> "$GITHUB_STEP_SUMMARY"
          fi
